# Purpose: Compile FFShare debug APKs and publish every successful master build as a GitHub Release.
# Invocation: Automatic on every push to master; manual dispatch remains available for validation only.
# Contract: Java 21, Android API 34, Gradle wrapper, FFmpegKitNext 8.1.1 for ARM, and one immutable build release per successful push.
# Verification: The job validates the AAR, requires at least one APK, publishes checksums, and creates the release only after every build step succeeds.
name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      FFMPEG_KIT_JOBS: "2"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
          log-accepted-android-sdk-licenses: "false"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Restore FFmpegKitNext AAR
        id: ffmpeg-kit-cache
        uses: actions/cache@v5
        with:
          path: app/libs/ffmpeg-kit-next-8.1.1.aar
          key: ffmpeg-kit-next-8.1.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_ffmpegkit.sh') }}

      - name: Prepare build scripts
        run: chmod +x gradlew build_ffmpegkit.sh

      - name: Build FFmpegKitNext AAR
        if: steps.ffmpeg-kit-cache.outputs.cache-hit != 'true'
        run: ./build_ffmpegkit.sh

      - name: Verify FFmpegKitNext AAR
        run: |
          test -s app/libs/ffmpeg-kit-next-8.1.1.aar
          unzip -tqq app/libs/ffmpeg-kit-next-8.1.1.aar
          sha256sum app/libs/ffmpeg-kit-next-8.1.1.aar

      - name: Compile debug APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APKs and checksums
        run: |
          artifact_dir="$RUNNER_TEMP/ffshare-apks"
          mkdir -p "$artifact_dir"

          mapfile -d '' -t apks < <(
            find app/build/outputs/apk/debug -type f -name '*.apk' -print0 | sort -z
          )
          if (( ${#apks[@]} == 0 )); then
            echo "No debug APKs were produced." >&2
            exit 1
          fi

          for apk in "${apks[@]}"; do
            cp -- "$apk" "$artifact_dir/"
          done
          (
            cd "$artifact_dir"
            sha256sum -- *.apk > SHA256SUMS
          )
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'generated_utc=%s\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
          } > "$artifact_dir/BUILD-INFO.txt"
          ls -lh "$artifact_dir"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: ffshare-debug-apks-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffshare-apks/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish successful master build to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_time="$(date -u '+%Y-%m-%d %H:%M UTC')"
          gh release create "$release_tag" \
            "$RUNNER_TEMP/ffshare-apks/"* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FFShare automatic build — $release_time" \
            --notes "Automatic debug APK build for commit $GITHUB_SHA. Includes APK files, SHA-256 checksums, and build metadata." \
            --latest
