# Purpose: Compile FFShare debug APKs and publish every successful master build as a GitHub Release.
# Invocation: Automatic on every push to master; manual dispatch remains available for validation only.
# Contract: Java 21, Android API 34, Gradle wrapper, FFmpegKitNext 8.1.1 for ARM, one persistent encrypted signing key for every published APK, immediate caching of a newly verified native AAR, one immutable build release per successful push, and retained native diagnostics on failure.
# Verification: The job validates the restored keystore against a pinned public certificate fingerprint, validates and caches the AAR before APK compilation, always uploads FFmpegKitNext's build log when native compilation runs, verifies every APK uses the pinned certificate, requires at least one APK, publishes checksums, and creates the release only after every build step succeeds.
name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      FFMPEG_KIT_JOBS: "2"
      EXPECTED_SIGNING_CERT_SHA256: "46a689628d6eb3b8caed692681adedf8e018554b410ec3f77c2694848008cd32"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
          log-accepted-android-sdk-licenses: "false"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      # The private key is never committed. GitHub stores the PKCS12 blob and its
      # credentials as repository secrets; only the public certificate fingerprint
      # above is source-controlled so an unintended key change fails closed.
      - name: Restore persistent APK signing identity
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.FFSHARE_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.FFSHARE_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.FFSHARE_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.FFSHARE_SIGNING_KEY_PASSWORD }}
        run: |
          for required in \
            SIGNING_KEYSTORE_BASE64 \
            SIGNING_STORE_PASSWORD \
            SIGNING_KEY_ALIAS \
            SIGNING_KEY_PASSWORD
          do
            if [[ -z "${!required}" ]]; then
              echo "Required signing secret is missing: $required" >&2
              exit 1
            fi
          done

          signing_dir="$RUNNER_TEMP/ffshare-signing"
          signing_store="$signing_dir/ffshare-ci-signing.p12"
          mkdir -p "$signing_dir"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_store"
          chmod 600 "$signing_store"

          actual_fingerprint="$({
            keytool -list -v \
              -keystore "$signing_store" \
              -storepass "$SIGNING_STORE_PASSWORD" \
              -alias "$SIGNING_KEY_ALIAS"
          } | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          if [[ "$actual_fingerprint" != "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
            echo "Signing certificate does not match the pinned FFShare identity." >&2
            exit 1
          fi

      - name: Restore FFmpegKitNext AAR
        id: ffmpeg-kit-cache
        uses: actions/cache/restore@v5
        with:
          path: app/libs/ffmpeg-kit-next-8.1.1.aar
          key: ffmpeg-kit-next-8.1.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_ffmpegkit.sh') }}

      - name: Prepare build scripts
        run: chmod +x gradlew build_ffmpegkit.sh

      - name: Build FFmpegKitNext AAR
        if: steps.ffmpeg-kit-cache.outputs.cache-hit != 'true'
        run: ./build_ffmpegkit.sh

      - name: Upload FFmpegKitNext build diagnostics
        if: always() && steps.ffmpeg-kit-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-kit-next-build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: .ffmpeg-kit-next-build/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify FFmpegKitNext AAR
        run: |
          test -s app/libs/ffmpeg-kit-next-8.1.1.aar
          unzip -tqq app/libs/ffmpeg-kit-next-8.1.1.aar
          sha256sum app/libs/ffmpeg-kit-next-8.1.1.aar

      - name: Save verified FFmpegKitNext AAR
        if: steps.ffmpeg-kit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: app/libs/ffmpeg-kit-next-8.1.1.aar
          key: ${{ steps.ffmpeg-kit-cache.outputs.cache-primary-key }}

      - name: Compile debug APKs
        env:
          ORG_GRADLE_PROJECT_FFSHARE_RELEASE_STORE_FILE: ${{ runner.temp }}/ffshare-signing/ffshare-ci-signing.p12
          ORG_GRADLE_PROJECT_FFSHARE_RELEASE_STORE_PASSWORD: ${{ secrets.FFSHARE_SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_FFSHARE_RELEASE_KEY_ALIAS: ${{ secrets.FFSHARE_SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_FFSHARE_RELEASE_KEY_PASSWORD: ${{ secrets.FFSHARE_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify persistent APK signing identity
        run: |
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          mapfile -d '' -t apks < <(
            find app/build/outputs/apk/debug -type f -name '*.apk' -print0 | sort -z
          )
          if (( ${#apks[@]} == 0 )); then
            echo "No debug APKs were produced." >&2
            exit 1
          fi

          for apk in "${apks[@]}"; do
            actual_fingerprint="$({
              "$apksigner" verify --print-certs "$apk"
            } | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            if [[ "$actual_fingerprint" != "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
              echo "Unexpected signing certificate: $apk" >&2
              exit 1
            fi
          done
          rm -f "$RUNNER_TEMP/ffshare-signing/ffshare-ci-signing.p12"

      - name: Collect APKs and checksums
        run: |
          artifact_dir="$RUNNER_TEMP/ffshare-apks"
          mkdir -p "$artifact_dir"

          mapfile -d '' -t apks < <(
            find app/build/outputs/apk/debug -type f -name '*.apk' -print0 | sort -z
          )
          if (( ${#apks[@]} == 0 )); then
            echo "No debug APKs were produced." >&2
            exit 1
          fi

          for apk in "${apks[@]}"; do
            cp -- "$apk" "$artifact_dir/"
          done
          (
            cd "$artifact_dir"
            sha256sum -- *.apk > SHA256SUMS
          )
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'signing_cert_sha256=%s\n' "$EXPECTED_SIGNING_CERT_SHA256"
            printf 'generated_utc=%s\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
          } > "$artifact_dir/BUILD-INFO.txt"
          ls -lh "$artifact_dir"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: ffshare-debug-apks-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffshare-apks/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish successful master build to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_time="$(date -u '+%Y-%m-%d %H:%M UTC')"
          gh release create "$release_tag" \
            "$RUNNER_TEMP/ffshare-apks/"* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FFShare automatic build — $release_time" \
            --notes "Automatic debug APK build for commit $GITHUB_SHA. Every published build uses the pinned FFShare signing certificate $EXPECTED_SIGNING_CERT_SHA256. Includes APK files, SHA-256 checksums, and build metadata." \
            --latest
